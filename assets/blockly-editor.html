<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blockly 積木編輯器</title>
  <style>
    * { box-sizing:border-box; } body { margin:0; font:13px/1.5 system-ui,sans-serif; background:#f5f6fa; color:#252738; }
    #tools { min-height:40px; padding:5px 8px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
    button, .file-label { font:inherit; border:1px solid #969bb2; border-radius:4px; padding:4px 8px; background:white; color:#252738; cursor:pointer; }
    :focus-visible { outline:3px solid #187e9c; outline-offset:2px; }
    #workspace { position:absolute; top:82px; bottom:0; width:100%; }
    #message { min-height:36px; padding:4px 8px; } #preview { white-space:pre-wrap; position:absolute; inset:82px 0 0; z-index:10; overflow:auto; margin:0; padding:16px; background:#282a36; color:#f8f8f2; }
    input[type=file] { max-width:190px; } [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div id="tools"><button id="export" type="button">匯出積木</button><label class="file-label">匯入積木 <input id="import" type="file" accept=".json,application/json" aria-label="匯入 Blockly 積木"></label><button id="preview-toggle" type="button" aria-expanded="false">查看 Python</button></div>
  <div id="message" role="status">積木工作區：從左側分類拖曳積木。</div>
  <div id="workspace" aria-label="Blockly 積木工作區"></div>
  <pre id="preview" hidden aria-label="積木產生的 Python 程式"></pre>
  <script src="vendor/blockly/blockly_compressed.js"></script>
  <script src="vendor/blockly/blocks_compressed.js"></script>
  <script src="vendor/blockly/python_compressed.js"></script>
  <script src="vendor/blockly/zh-hant.js"></script>
  <script src="blockly-editor.js"></script>
</body>
</html>
