<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SkillLab 程式學習平台，支援 Scratch、Blockly 與 Python。" />
  <title>SkillLab｜程式學習</title>
  <style>
    :root {
      --ink: #f5f7fa;
      --paper: #111214;
      --line: #30343a;
      --muted: #a6adb7;
      --soft: #181a1d;
      --accent: #3d6fd8;
      --accent-hover: #4b7de7;
      --header-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
    }

    a,
    button {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #8eb0ff;
      outline-offset: 3px;
    }

    .site-header {
      min-height: var(--header-height);
      padding: 0 clamp(24px, 7vw, 112px);
      display: flex;
      align-items: center;
      gap: 40px;
      color: white;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 18, 20, 0.96);
    }

    .brand {
      color: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
    }

    .header-nav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .header-nav a {
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .header-nav a:hover,
    .header-nav a:focus-visible {
      color: white;
    }

    main {
      width: min(1180px, 100%);
      min-height: calc(100vh - var(--header-height));
      margin: 0 auto;
      padding: clamp(64px, 9vh, 108px) clamp(24px, 5vw, 64px) 70px;
      display: flex;
      align-items: flex-start;
    }

    .entry {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
      align-items: center;
      gap: clamp(56px, 9vw, 124px);
    }

    .entry h1 {
      max-width: 660px;
      font-size: clamp(3.2rem, 7vw, 6.8rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0.02em;
    }

    .entry-list {
      width: min(100%, 360px);
      display: grid;
      gap: 12px;
    }

    .entry-button {
      min-height: 58px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      color: var(--ink);
      background: transparent;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .entry-button::after {
      content: "";
      width: 26px;
      height: 1px;
      background: currentColor;
      transform-origin: right;
      transition: transform 160ms ease;
    }

    a.entry-button:hover,
    a.entry-button:focus-visible {
      color: white;
      border-color: #444a53;
      background: var(--soft);
      transform: translateX(5px);
    }

    .entry-list a:first-child {
      border-color: var(--accent);
      color: white;
      background: var(--accent);
    }

    .entry-list a:first-child:hover,
    .entry-list a:first-child:focus-visible {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    a.entry-button:hover::after,
    a.entry-button:focus-visible::after {
      transform: scaleX(0.55);
    }

    .entry-button[aria-disabled="true"] {
      color: #7c8491;
      border-color: #24272c;
      cursor: not-allowed;
    }

    @media (max-width: 880px) {
      :root {
        --header-height: 68px;
      }

      .site-header {
        padding-inline: 24px;
      }

      main {
        min-height: auto;
        padding: 64px 24px 72px;
      }

      .entry {
        grid-template-columns: 1fr;
        gap: 56px;
      }

      .entry-list {
        width: min(100%, 360px);
      }

    }

    @media (max-width: 520px) {
      .header-nav {
        gap: 16px;
      }

      .header-nav a:first-child {
        display: none;
      }

      main {
        padding-top: 48px;
      }

      .entry h1 {
        font-size: clamp(2.55rem, 14vw, 4rem);
      }

      .entry-button {
        min-height: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">SkillLab</a>
    <nav class="header-nav" aria-label="主要導覽">
      <a href="beginner.html">入門講義</a>
      <a href="judge.html">題目列表</a>
    </nav>
  </header>

  <main>
    <section class="entry" aria-labelledby="page-title">
      <h1 id="page-title">ONLINE JUDGE</h1>
      <div class="entry-list" aria-label="學習入口">
        <a class="entry-button" href="judge.html">開始解題</a>
        <a class="entry-button" href="beginner.html">入門講義</a>
        <span class="entry-button" aria-disabled="true">中階講義</span>
        <span class="entry-button" aria-disabled="true">進階講義</span>
      </div>
    </section>

  </main>
</body>

</html>
